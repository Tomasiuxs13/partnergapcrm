<script>
window.__boot = (() => {
  // These start before the stylesheets and modules load (a script after a stylesheet waits for it, and
  // these two requests would then queue behind ~70 files). A failed request is read and shown by
  // core/meta.js and core/store.js (the cached list and "Couldn't refresh"); quiet() keeps it from being
  // reported as uncaught. cached: the list in Cache Storage, read and parsed while the modules load
  // (core/cache.js#read; null when there is none).
  const quiet = (p) => { p.catch(() => {}); return p; };
  let e = null; try { e = localStorage.getItem('pgcrm-cache-etag'); } catch (x) {}
  return {
    meta: quiet(fetch('/api/meta', {credentials: 'same-origin'})),
    partners: quiet(fetch('/api/partners?v=2', {credentials: 'same-origin', headers: e ? {'If-None-Match': e} : {}})),
    cached: typeof caches === 'undefined' ? null : quiet(caches.open('pgcrm').then((c) => c.match('/api/partners?v=2'))
      .then((r) => (r ? r.json().then((data) => ({data, headers: r.headers})) : null)))
  };
})();
</script>
